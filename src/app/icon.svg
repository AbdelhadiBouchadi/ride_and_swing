<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Basalt ground with the ochre horizon rule the site uses throughout. -->
  <rect width="32" height="32" fill="#1c2321"/>
  <rect x="0" y="21" width="32" height="1" fill="#c4703a"/>
  <!-- A didone "T": thin/thick stress is the whole identity, so the mark keeps
       the hairline crossbar rather than flattening to a slab. -->
  <rect x="6" y="8" width="20" height="3.4" fill="#e8dfd3"/>
  <rect x="14.2" y="8" width="3.6" height="11" fill="#e8dfd3"/>
</svg>
